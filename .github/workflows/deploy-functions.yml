name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tbwmckmyzoxzhpqlomsp
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Require deployment token
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::Missing repo secret SUPABASE_ACCESS_TOKEN"; exit 1
          fi

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.81.3

      - name: Update Anthropic secret when supplied
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
          fi

      - name: Require and update push secrets
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          for name in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY PUSH_CRON_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repo secret $name"; exit 1
            fi
          done
          supabase secrets set \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            PUSH_CRON_SECRET="$PUSH_CRON_SECRET" \
            --project-ref "$PROJECT_REF"

      - name: Deploy every Edge Function
        run: |
          for fn in delete-account ai-coach paddle-webhook push-daily product-health; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
